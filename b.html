<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Animated Alphabet Canvas</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8fafc;
            font-family: sans-serif;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        canvas {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="controls" id="btnContainer"></div>
    <canvas id="alphaCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('alphaCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let progress = 0;

        // Letter Definitions: type 'line' (x1, y1, x2, y2) or 'curve' (x1, y1, cp1x, cp1y, cp2x, cp2y, x2, y2)
        const alphabet = {
            'A': [
                { type: 'line', points: [50, 20, 20, 80] },
                { type: 'line', points: [50, 20, 80, 80] },
                { type: 'line', points: [35, 55, 65, 55] }
            ],
            'B': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'curve', points: [30, 20, 75, 20, 75, 50, 30, 50] },
                { type: 'curve', points: [30, 50, 85, 50, 85, 80, 30, 80] }
            ],
            'C': [
                { type: 'curve', points: [70, 30, 20, 10, 20, 90, 70, 70] }
            ],
            'D': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'curve', points: [30, 20, 85, 20, 85, 80, 30, 80] }
            ],
            'E': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'line', points: [30, 20, 70, 20] },
                { type: 'line', points: [30, 50, 60, 50] },
                { type: 'line', points: [30, 80, 70, 80] }
            ],
            'F': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'line', points: [30, 20, 70, 20] },
                { type: 'line', points: [30, 50, 60, 50] }
            ],
            'G': [
                { type: 'curve', points: [70, 30, 20, 10, 20, 90, 70, 70] },
                { type: 'line', points: [70, 70, 70, 50] },
                { type: 'line', points: [70, 50, 50, 50] }
            ],
            'H': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'line', points: [70, 20, 70, 80] },
                { type: 'line', points: [30, 50, 70, 50] }
            ],
            'I': [
                { type: 'line', points: [50, 20, 50, 80] },
                { type: 'line', points: [30, 20, 70, 20] },
                { type: 'line', points: [30, 80, 70, 80] }
            ],
            'J': [
                { type: 'line', points: [60, 20, 60, 70] },
                { type: 'curve', points: [60, 70, 60, 90, 20, 90, 20, 70] }
            ],
            'K': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'line', points: [70, 20, 30, 50] },
                { type: 'line', points: [30, 50, 70, 80] }
            ],
            'L': [
                { type: 'line', points: [35, 20, 35, 80] },
                { type: 'line', points: [35, 80, 70, 80] }
            ],
            'M': [
                { type: 'line', points: [20, 80, 20, 20] },
                { type: 'line', points: [20, 20, 50, 50] },
                { type: 'line', points: [50, 50, 80, 20] },
                { type: 'line', points: [80, 20, 80, 80] }
            ],
            'N': [
                { type: 'line', points: [30, 80, 30, 20] },
                { type: 'line', points: [30, 20, 70, 80] },
                { type: 'line', points: [70, 80, 70, 20] }
            ],
            'O': [
                { type: 'curve', points: [50, 20, 90, 20, 90, 80, 50, 80] },
                { type: 'curve', points: [50, 80, 10, 80, 10, 20, 50, 20] }
            ],
            'P': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'curve', points: [30, 20, 80, 20, 80, 50, 30, 50] }
            ],
            'Q': [
                { type: 'curve', points: [50, 20, 90, 20, 90, 80, 50, 80] },
                { type: 'curve', points: [50, 80, 10, 80, 10, 20, 50, 20] },
                { type: 'line', points: [60, 65, 85, 90] }
            ],
            'R': [
                { type: 'line', points: [30, 20, 30, 80] },
                { type: 'curve', points: [30, 20, 80, 20, 80, 50, 30, 50] },
                { type: 'line', points: [30, 50, 75, 80] }
            ],
            'S': [
                { type: 'curve', points: [75, 30, 75, 10, 20, 30, 50, 50] },
                { type: 'curve', points: [50, 50, 80, 70, 25, 90, 25, 70] }
            ],
            'T': [
                { type: 'line', points: [30, 20, 70, 20] },
                { type: 'line', points: [50, 20, 50, 80] }
            ],
            'U': [
                { type: 'curve', points: [25, 20, 25, 100, 75, 100, 75, 20] }
            ],
            'V': [
                { type: 'line', points: [25, 20, 50, 80] },
                { type: 'line', points: [50, 80, 75, 20] }
            ],
            'W': [
                { type: 'line', points: [15, 20, 30, 80] },
                { type: 'line', points: [30, 80, 50, 40] },
                { type: 'line', points: [50, 40, 70, 80] },
                { type: 'line', points: [70, 80, 85, 20] }
            ],
            'X': [
                { type: 'line', points: [25, 20, 75, 80] },
                { type: 'line', points: [75, 20, 25, 80] }
            ],
            'Y': [
                { type: 'line', points: [20, 20, 50, 50] },
                { type: 'line', points: [80, 20, 50, 50] },
                { type: 'line', points: [50, 50, 50, 85] }
            ],
            'Z': [
                { type: 'line', points: [25, 20, 75, 20] },
                { type: 'line', points: [75, 20, 25, 80] },
                { type: 'line', points: [25, 80, 75, 80] }
            ]
        };

        function getBezierPoint(t, p) {
            const n = 1 - t;
            return {
                x: n ** 3 * p[0] + 3 * n ** 2 * t * p[2] + 3 * n * t ** 2 * p[4] + t ** 3 * p[6],
                y: n ** 3 * p[1] + 3 * n ** 2 * t * p[3] + 3 * n * t ** 2 * p[5] + t ** 3 * p[7]
            };
        }

        function drawLetter(letterKey) {
            const strokes = alphabet[letterKey];
            if (!strokes) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 15;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const totalStrokes = strokes.length;
            const strokeDuration = 1 / totalStrokes;

            strokes.forEach((stroke, index) => {
                const startThreshold = index * strokeDuration;
                if (progress < startThreshold) return;

                const strokeProgress = Math.min((progress - startThreshold) / strokeDuration, 1);
                const p = stroke.points.map(val => val * 3 + 50); // Scale 0-100 to canvas size

                ctx.beginPath();
                if (stroke.type === 'line') {
                    ctx.moveTo(p[0], p[1]);
                    ctx.lineTo(p[0] + (p[2] - p[0]) * strokeProgress, p[1] + (p[3] - p[1]) * strokeProgress);
                } else {
                    ctx.moveTo(p[0], p[1]);
                    for (let i = 0; i <= strokeProgress; i += 0.02) {
                        const pt = getBezierPoint(i, p);
                        ctx.lineTo(pt.x, pt.y);
                    }
                }
                ctx.stroke();
            });

            if (progress < 1) {
                progress += 0.008;
                animationId = requestAnimationFrame(() => drawLetter(letterKey));
            }
        }

        function start(char) {
            progress = 0;
            cancelAnimationFrame(animationId);
            drawLetter(char);
        }

        // Create buttons for available letters
        const btnContainer = document.getElementById('btnContainer');
        Object.keys(alphabet).forEach(char => {
            const btn = document.createElement('button');
            btn.innerText = char;
            btn.onclick = () => start(char);
            btnContainer.appendChild(btn);
        });

        start('A'); // Default start
    </script>
</body>

</html>
