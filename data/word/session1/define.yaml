adverbs:
  - question: fast
    answer: fast
    translation: വേഗത്തിൽ
    transliteration: vegathil
    ansOptions:
      choices: [fast, slow, jump, eat]
      translations: [വേഗത്തിൽ, മന്ദഗതിയോടെ, ചാടുക, ഭക്ഷിക്കുക]
      transliterations: [vegathil, mandagathiyode, chaduka, bhakshikkuka]

  - question: slowly
    answer: slowly
    translation: മന്ദഗതിയോടെ
    transliteration: mandagathiyode
    ansOptions:
      choices: [slowly, quickly, read, swim]
      translations: [മന്ദഗതിയോടെ, വേഗത്തിൽ, വായിക്കുക, നീന്തുക]
      transliterations: [mandagathiyode, vegathil, vayikkuka, neenthuka]

  - question: quickly
    answer: quickly
    translation: വേഗത്തിൽ
    transliteration: vegathil
    ansOptions:
      choices: [quickly, slowly, sleep, write]
      translations: [വേഗത്തിൽ, മന്ദഗതിയോടെ, ഉറങ്ങുക, എഴുതുക]
      transliterations: [vegathil, mandagathiyode, uranguka, ezhuthukuka]

  - question: suddenly
    answer: suddenly
    translation: അപ്രതീക്ഷിതമായി
    transliteration: apratheekshithamayi
    ansOptions:
      choices: [suddenly, carefully, eat, jump]
      translations: [അപ്രതീക്ഷിതമായി, ശ്രദ്ധാപൂർവ്വം, ഭക്ഷിക്കുക, ചാടുക]
      transliterations: [apratheekshithamayi, shraddhapoorvam, bhakshikkuka, chaduka]

  - question: directly
    answer: directly
    translation: നേരിട്ട്
    transliteration: neritt
    ansOptions:
      choices: [directly, slowly, love, run]
      translations: [നേരിട്ട്, മന്ദഗതിയോടെ, സ്നേഹം, ഓടുക]
      transliterations: [neritt, mandagathiyode, sneham, oduka]