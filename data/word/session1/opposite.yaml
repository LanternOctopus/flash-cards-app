opposites:
  - question: "What's the opposite of fast?"
    answer: slow
    translation: "വേഗത്തിന്റെ വിരുദ്ധം എന്താണ്?"
    transliteration: "vegathinte viruddham enthaan?"
    ansOptions:
      choices: [slow, jump, eat, love]
      translations: [മന്ദം, ചാടുക, ഭക്ഷിക്കുക, സ്നേഹം]
      transliterations: [mandam, chaduka, bhakshikkuka, sneham]

  - question: "What's the opposite of slowly?"
    answer: quickly
    translation: "മന്ദഗതിയോടെയുള്ളത് എതിര്‍പ്പാണ് എന്ത്?"
    transliteration: "mandagathiyodeyulla ethirppaan enthu?"
    ansOptions:
      choices: [quickly, sleep, read, swim]
      translations: [വേഗത്തിൽ, ഉറങ്ങുക, വായിക്കുക, നീന്തുക]
      transliterations: [vegathil, uranguka, vayikkuka, neenthuka]

  - question: "What's the opposite of quickly?"
    answer: slowly
    translation: "വേഗത്തിൽ എന്നതിന് എതിര്‍ക്കുന്നത് എന്താണ്?"
    transliteration: "vegathil ennatthin ethirkkunnathu enthaan?"
    ansOptions:
      choices: [slowly, write, eat, jump]
      translations: [മന്ദഗതിയോടെ, എഴുതുക, ഭക്ഷിക്കുക, ചാടുക]
      transliterations: [mandagathiyode, ezhuthukuka, bhakshikkuka, chaduka]

  - question: "What's the opposite of suddenly?"
    answer: gradually
    translation: "അപ്രതീക്ഷിതമായി എന്നതിന് എതിര്‍ക്കുന്നത് എന്താണ്?"
    transliteration: "apratheekshithamayi ennatthin ethirkkunnathu enthaan?"
    ansOptions:
      choices: [gradually, carefully, sleep, jump]
      translations: [പടിയിറങ്ങിക്കൊണ്ടു, ശ്രദ്ധാപൂർവ്വം, ഉറങ്ങുക, ചാടുക]
      transliterations: [padiyarangikkondu, shraddhapoorvam, uranguka, chaduka]

  - question: "What's the opposite of directly?"
    answer: indirectly
    translation: "നേരിട്ട് എന്നതിന് എതിര്‍ക്കുന്നത് എന്താണ്?"
    transliteration: "neritt ennatthin ethirkkunnathu enthaan?"
    ansOptions:
      choices: [indirectly, slowly, love, run]
      translations: [പരോക്ഷമായി, മന്ദഗതിയോടെ, സ്നേഹം, ഓടുക]
      transliterations: [parokshamayi, mandagathiyode, sneham, oduka]