Words You Can Do at Your Desk:
    - answer: Say your name out loud and clear. Good. I heard you.
      picture: wordsyoucandoatyourdesk/wordsyoucandoatyourdesk.png
      caption: A Poem That Tells You What to Do!
      alt: Words You Can Do at Your Desk cover.
      phonemes:
          - sˈeɪ jʊɹ nˈeɪm ˈaʊt lˈaʊd ænd klˈɪɹ
          - ɡˈʊd
          - aɪ hˈɜːd juː
    - answer: Tell me one thing you like. Just one—nice and slow.
      phonemes:
          - tˈɛl mˌiː wˈʌn θˈɪŋ juː lˈaɪk
          - dʒˈʌst wˈʌn nˈaɪs ænd slˈoʊ
    - answer: Speak in a calm, quiet voice. Let the words come out smooth.
      phonemes:
          - spˈiːk ɪn ɐ kˈɑːm
          - kwˈaɪət vˈɔɪs
          - lˈɛt ðə wˈɜːdz kˈʌm ˈaʊt smˈuːð
    - answer: Talk to a friend beside you. Just a short, friendly talk.
      phonemes:
          - tˈɔːk tʊ ɐ fɹˈɛnd bᵻsˈaɪd juː
          - dʒˈʌst ɐ ʃˈɔːɹt
          - fɹˈɛndli tˈɔːk
    - answer: Ask a question with your hand up. Wait your turn. That's right.
      phonemes:
          - ˈæsk ɐ kwˈɛstʃən wɪð jʊɹ hˈænd ˈʌp
          - wˈeɪt jʊɹ tˈɜːn
          - ðæts ɹˈaɪt
    - answer: Call my name softly. Not loud—just enough.
      phonemes:
          - kˈɔːl maɪ nˈeɪm sˈɔftli
          - nˌɑːt lˈaʊd dʒˈʌst ɪnˈʌf
    - answer: Write one word on your paper. Careful letters. Take your time.
      phonemes:
          - ɹˈaɪt wˈʌn wˈɜːd ˌɔn jʊɹ pˈeɪpɚ
          - kˈɛɹfəl lˈɛɾɚz
          - tˈeɪk jʊɹ tˈaɪm
    - answer: Read the word you wrote. Point to it as you read.
      phonemes:
          - ɹˈiːd ðə wˈɜːd juː ɹˈoʊt
          - pˈɔɪnt tʊ ɪɾ æz juː ɹˈiːd
    - answer: Show your paper to the teacher. Hold it up nice and proud.
      phonemes:
          - ʃˈoʊ jʊɹ pˈeɪpɚ tə ðə tˈiːtʃɚ
          - hˈoʊld ɪɾ ˌʌp nˈaɪs ænd pɹˈaʊd
    - answer: Send your message with a smile. Words can travel—even from a desk.
      phonemes:
          - sˈɛnd jʊɹ mˈɛsɪdʒ wɪð ɐ smˈaɪl
          - wˈɜːdz kæn tɹˈævəl ˈiːvən fɹʌm ɐ dˈɛsk
