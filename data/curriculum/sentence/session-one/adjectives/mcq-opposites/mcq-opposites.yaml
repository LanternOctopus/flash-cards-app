adjectives:
    - prompt_en: "What is the opposite of: This is a good book."
      prompt_targetLang: "ഇതിന്റെ വിപരീതം എന്താണ്: ഇത് ഒരു നല്ല പുസ്തകമാണ്."
      prompt_phonetics: "ithinte vipareetham enthaanu: ithu oru nalla pusthakamanu."

      answer: "This is a bad book."
      answer_targetLang: "ഇത് ഒരു മോശം പുസ്തകമാണ്."
      answer_phonetics: "ithu oru mosham pusthakamanu."

      distractors:
          en:
              - "This is a big book."
              - "This is a new book."
              - "This is a small book."

          targetLang:
              - "ഇത് ഒരു വലിയ പുസ്തകമാണ്."
              - "ഇത് ഒരു പുതിയ പുസ്തകമാണ്."
              - "ഇത് ഒരു ചെറിയ പുസ്തകമാണ്."

          phonetics:
              - "ithu oru valiya pusthakamanu."
              - "ithu oru puthiya pusthakamanu."
              - "ithu oru cheriya pusthakamanu."

      learningHint: "‘Good’ describes something positive."

