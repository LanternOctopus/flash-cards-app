              - "njan ella divasavum ravile officil pokunnu."
              - "njan ella divasavum ravile officil pokunnu."
              - "njan ella divasavum ravile officil poyi."
      learningHint: "Use base verb 'go' with 'I' for habits."
      meta:
          subject: "I"
          tense: "simple present"

