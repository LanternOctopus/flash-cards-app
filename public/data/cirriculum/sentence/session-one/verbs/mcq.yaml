      phonetics: "njan ella divasavum ravile officil pokunnu."
      distractors:
          choices:
              - "I goes to the office every morning."
              - "I am go to the office every morning."
              - "I went to the office every morning."
          translations:
              - "ഞാൻ എല്ലാ ദിവസവും രാവിലെ ഓഫീസിൽ പോകുന്നു."
              - "ഞാൻ എല്ലാ ദിവസവും രാവിലെ ഓഫീസിൽ പോകുന്നു."
