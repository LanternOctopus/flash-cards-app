    - question: "go"
      english: "They will go to a new place next year."
      targetLang: "അവർ അടുത്ത വർഷം പുതിയൊരു സ്ഥലത്തേക്ക് പോകും."
      phonetics: "avar adutha varsham puthiyoru sthalathekku pokum."
      distractors:
          choices:
              - "They will goes to a new place."
              - "They going to go next year."
              - "They will went to a new place."
          translations:
              - "അവർ പുതിയ സ്ഥലത്തേക്ക് പോകും."
              - "അവർ അടുത്ത വർഷം പോകുന്നു."
