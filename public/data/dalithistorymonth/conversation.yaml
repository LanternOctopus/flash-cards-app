start: intro

nodes:
    intro:
        id: intro
        text: "Hey. You showed up."
        speakerName: "Gabbilamu"
        speakerRole: "Mascot"
        speakerImage: "/mascot/happy.png"
        choices:
            - text: "Hi"
              next: greet
            - text: "Ignore"
              next: ignore

    greet:
        id: greet
        text: "Good girl. I was waiting."
        speakerName: "Gabbilamu"
        speakerImage: "/mascot/proud.png"
        choices:
            - text: "What now?"
              next: question

    ignore:
        id: ignore
        text: "...you're mean."
        speakerName: "Gabbilamu"
        speakerImage: "/mascot/sad.png"
        choices:
            - text: "Fine, sorry"
              next: greet

    question:
        id: question
        text: "What is 2 + 2?"
        speakerName: "Gabbilamu"
        speakerImage: "/mascot/thinking.png"
        choices:
            - text: "4"
              next: correct
            - text: "5"
              next: wrong

    correct:
        id: correct
        text: "That's right. Knew you had it in you."
        speakerName: "Gabbilamu"
        speakerImage: "/mascot/happy.png"

    wrong:
        id: wrong
        text: "No. Try again."
        speakerName: "Gabbilamu"
        speakerImage: "/mascot/concerned.png"
        choices:
            - text: "Retry"
              next: question
