Section1:
    - passage: "God in the temple sends messages with many asking me to visit him. Can I follow you? Should I come? If the temple entry is delayed there is a danger that people on a hunger strike will die. I will not bear the pain of a single death of an Andhra person."
      question: "What are people asking the speaker?"
      answer: "To visit the temple"
      wrongAnswers:
          - "To leave the country"
          - "To join a protest"
          - "To stay silent"
      learningHint: "The passage shows people urging the speaker to take action related to temple access."

    - passage: "God in the temple sends messages with many asking me to visit him. Can I follow you? Should I come? If the temple entry is delayed there is a danger that people on a hunger strike will die. I will not bear the pain of a single death of an Andhra person."
      question: "How does the speaker feel about possible deaths?"
      answer: "Deeply concerned"
      wrongAnswers:
          - "Indifferent"
          - "Angry"
          - "Excited"
      learningHint: "The speaker expresses emotional responsibility and fear of loss of life."

    - passage: "God in the temple sends messages with many asking me to visit him. Can I follow you? Should I come? If the temple entry is delayed there is a danger that people on a hunger strike will die. I will not bear the pain of a single death of an Andhra person."
      question: "What does 'I will not bear the pain' show?"
      answer: "The speaker feels emotional responsibility"
      wrongAnswers:
          - "The speaker avoids responsibility"
          - "The speaker is afraid of being hit"
          - "The speaker is confused"
      learningHint: "It indicates empathy and moral burden for others' suffering."

    - passage: "God in the temple sends messages with many asking me to visit him. Can I follow you? Should I come? If the temple entry is delayed there is a danger that people on a hunger strike will die. I will not bear the pain of a single death of an Andhra person."
      question: "What does 'Can I follow you? Should I come?' suggest?"
      answer: "Confusion and hesitation"
      wrongAnswers:
          - "Anger and protest"
          - "Celebration and joy"
          - "Indifference"
      learningHint: "The speaker is uncertain about whether to proceed or not."

    - passage: "Until recently, they used to keep a distance. Now they invite me into a temple. Just because of that, I cannot run inside, forgetting the reality. Will that bring self-respect? Is God’s abode cheaper than the streets of begging priests? The sacred temple considered beneath the middle of the road on which millions walk?"
      question: "What change has happened recently according to the passage?"
      answer: "The speaker is now being invited into a temple"
      wrongAnswers:
          - "People stopped worshipping God"
          - "The speaker is no longer allowed in temples"
          - "Temples are being closed"
      learningHint: "There is a shift from exclusion to sudden inclusion."

    - passage: "Until recently, they used to keep a distance. Now they invite me into a temple. Just because of that, I cannot run inside, forgetting the reality. Will that bring self-respect? Is God’s abode cheaper than the streets of begging priests? The sacred temple considered beneath the middle of the road on which millions walk?"
      question: "What did people do until recently?"
      answer: "They avoided the speaker"
      wrongAnswers:
          - "They worshipped the speaker"
          - "They invited the speaker everywhere"
          - "They followed the speaker"
      learningHint: "The passage implies earlier exclusion or social distance."

    - passage: "Until recently, they used to keep a distance. Now they invite me into a temple. Just because of that, I cannot run inside, forgetting the reality. Will that bring self-respect? Is God’s abode cheaper than the streets of begging priests? The sacred temple considered beneath the middle of the road on which millions walk?"
      question: "What comparison is made in the passage?"
      answer: "Temple vs street of begging priests"
      wrongAnswers:
          - "Temple vs palace"
          - "God vs humans"
          - "Rich vs poor houses"
      learningHint: "The comparison critiques social and moral value systems."

    - passage: "Until recently, they used to keep a distance. Now they invite me into a temple. Just because of that, I cannot run inside, forgetting the reality. Will that bring self-respect?"
      question: "What attitude does the speaker show toward sudden acceptance into the temple?"
      answer: "Suspicion and reflection"
      wrongAnswers:
          - "Excitement"
          - "Joyful acceptance"
          - "Indifference"
      learningHint: "The speaker questions the sincerity of sudden inclusion."

    - passage: "Sacred offerings have become debased in front of forced inter-caste dining. The fight to access village water tanks dilute the purity of the deepest waters of the Ganga. Inquire who is higher and lower among them."
      question: "What has become 'debased' according to the passage?"
      answer: "Sacred offerings"
      wrongAnswers:
          - "Water tanks"
          - "Village traditions"
          - "Temples"
      learningHint: "Ritual purity is being questioned in a social context."

    - passage: "Sacred offerings have become debased in front of forced inter-caste dining. The fight to access village water tanks dilute the purity of the deepest waters of the Ganga. Inquire who is higher and lower among them."
      question: "What struggle is mentioned in the passage?"
      answer: "Fight to access village water tanks"
      wrongAnswers:
          - "Fight for temple entry"
          - "Fight for land ownership"
          - "Fight for education"
      learningHint: "The passage highlights caste-based access to resources."

    - passage: "Sacred offerings have become debased in front of forced inter-caste dining. The fight to access village water tanks dilute the purity of the deepest waters of the Ganga."
      question: "What does 'dilute the purity of the Ganga' most likely imply in this context?"
      answer: "A rhetorical critique of purity ideology"
      wrongAnswers:
          - "Physical pollution of rivers"
          - "Emotional sadness"
          - "A description of geography"
      learningHint: "Purity is used symbolically to question social hierarchy."

    - passage: "Sacred offerings have become debased in front of forced inter-caste dining. The fight to access village water tanks dilute the purity of the deepest waters of the Ganga."
      question: "What is the speaker mainly criticizing?"
      answer: "Superficial caste reform without structural change"
      wrongAnswers:
          - "Lack of religious faith"
          - "Water management policies"
          - "Temple administration"
      learningHint: "The critique focuses on symbolic reform vs real inequality."

    - passage: "For the sake of renown, a poet might conceal his passion and compromise with the world. Might follow the path of worldliness like a mad man. That way, he will be a disgrace to the goddess of learning."
      question: "What might a poet do for the sake of renown?"
      answer: "Conceal his passion and compromise with the world"
      wrongAnswers:
          - "Write only religious poems"
          - "Reject all writing"
          - "Become a teacher"
      learningHint: "The poet sacrifices authenticity for fame."

    - passage: "For the sake of renown, a poet might conceal his passion and compromise with the world."
      question: "In the passage, 'worldliness' most likely refers to:"
      answer: "Pursuit of fame, material success, and social approval"
      wrongAnswers:
          - "Living a peaceful life in society"
          - "Devotion to learning and wisdom"
          - "Withdrawal from society for reflection"
      learningHint: "Worldliness here has a negative moral tone of material pursuit."

    - passage: "For the sake of renown, a poet might conceal his passion and compromise with the world."
      question: "What is the main idea of the passage?"
      answer: "Artistic integrity is lost when one compromises for worldly gain"
      wrongAnswers:
          - "Poets should seek wealth"
          - "Fame is the highest goal in life"
          - "Learning is unimportant"
      learningHint: "The passage warns against sacrificing integrity for fame."

    - passage: "The quagmire of caste difference has existed for ages. It enslaved and kept people in poverty. These are the days to overcome this and progress further. Provide shelter to farmers crushed under the wheels of the king’s chariot."
      question: "What is described as existing for ages in the passage?"
      answer: "Caste difference"
      wrongAnswers:
          - "Poverty"
          - "Farming systems"
          - "Kingship"
      learningHint: "Caste is presented as a long-standing social structure."

    - passage: "The quagmire of caste difference has existed for ages. It enslaved and kept people in poverty."
      question: "What has caste difference done according to the passage?"
      answer: "Enslaved people and kept them in poverty"
      wrongAnswers:
          - "Improved social harmony"
          - "Increased education levels"
          - "Strengthened agriculture"
      learningHint: "It highlights oppression and economic deprivation."

    - passage: "The quagmire of caste difference has existed for ages."
      question: "What does 'quagmire of caste difference' imply?"
      answer: "A confusing and trapping social system"
      wrongAnswers:
          - "A natural landscape"
          - "A political revolution"
          - "A farming technique"
      learningHint: "Quagmire metaphorically means a sticky, trapping situation."

    - passage: "These are the days to overcome this and progress further."
      question: "What does 'these are the days to overcome this' suggest?"
      answer: "Social reform is urgent and possible now"
      wrongAnswers:
          - "Change is impossible"
          - "The past should be repeated"
          - "Nothing should change"
      learningHint: "It signals urgency and possibility of reform."

    - passage: "Provide shelter to farmers crushed under the wheels of the king’s chariot."
      question: "What image is used to describe suffering farmers?"
      answer: "Crushed under the wheels of the king’s chariot"
      wrongAnswers:
          - "Birds in a storm"
          - "Lost in a forest"
          - "Standing in rain"
      learningHint: "This is a strong metaphor for oppression and suffering."
