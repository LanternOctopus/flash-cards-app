    - text: Animals that live only in one place are called endemic species. Lençóis Maranhenses is home to many of them.
      phonemes:
          - ˈænɪməlz ðæt lˈaɪv ˈoʊnli ɪn wˈʌn plˈeɪs ɑːɹ kˈɔːld ɛndˈɛmɪk spˈiːsiːz
