          - ðə lɐɡˈuːnz slˈoʊli dˌɪsɐpˈɪɹ
          - bˌʌt ðə wˈɔːɾɚ nˈɛvɚ tɹˈuːli lˈiːvz
    - text: Many animals here are specially adapted to survive. They are used to both extreme wet and extreme dry times.
      phonemes:
          - mˈɛni ˈænɪməlz hˈɪɹ ɑːɹ spˈɛʃəli ɐdˈæptᵻd tə sɚvˈaɪv
          - ðeɪ ɑːɹ jˈuːzd tə bˈoʊθ ɛkstɹˈiːm wˈɛt ænd ɛkstɹˈiːm dɹˈaɪ tˈaɪmz
    - text: Some fish live their entire lives in one rainy season. They leave eggs behind that sleep through the dry months.
      phonemes:
          - sˌʌm fˈɪʃ lˈaɪv ðɛɹ ɛntˈaɪɚ lˈaɪvz ɪn wˈʌn ɹˈeɪni sˈiːzən
          - ðeɪ lˈiːv ˈɛɡz bᵻhˌaɪnd ðæt slˈiːp θɹuː ðə dɹˈaɪ mˈʌnθs
    - text: When the rains return, the eggs hatch all at once. The lagoons suddenly fill with life again.
      phonemes:
