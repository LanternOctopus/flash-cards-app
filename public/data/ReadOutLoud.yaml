Lencois Maranhenses:
    - picture: desert/desert.png
    - text: Far away on the northeast coast of Brazil lies a place called Lençóis Maranhenses. At first glance, it looks like a desert made of snow-white sand.
      phonemes:
          - fˈɑːɹ ɐwˈeɪ ɔnðə nˈɔːɹθiːst kˈoʊst ʌv bɹɐzˈɪl lˈaɪz ɐ plˈeɪs kˈɔːld lˈɛnswɑː mˈæɹɐnhˌɛnsᵻz
          - æt fˈɜːst ɡlˈæns
          - ɪt lˈʊks lˈaɪk ɐ dˈɛzɚt mˌeɪd ʌv snˈoʊwˈaɪt sˈænd
    - text: The sand shines so brightly it almost hurts your eyes. The dunes roll and curve like giant waves frozen in time.
      phonemes:
          - ðə sˈænd ʃˈaɪnz sˌoʊ bɹˈaɪtli ɪɾ ˈɔːlmoʊst hˈɜːts jʊɹ ˈaɪz
          - ðə dˈuːnz ɹˈoʊl ænd kˈɜːv lˈaɪk dʒˈaɪənt wˈeɪvz fɹˈoʊzən ɪn tˈaɪm
    - text: But this is no ordinary desert. When the rains come, water appears everywhere.
      phonemes:
          - bˌʌt ðɪs ɪz nˈoʊ ˈɔːɹdɪnˌɛɹi dˈɛzɚt
          - wˌɛn ðə ɹˈeɪnz kˈʌm
          - wˈɔːɾɚɹ ɐpˈɪɹz ˈɛvɹɪwˌɛɹ
    - text: Between the dunes, lagoons fill with clear blue and green water. They sparkle like jewels under the sun.
      phonemes:
          - bᵻtwˌiːn ðə dˈuːnz
          - lɐɡˈuːnz fˈɪl wɪð klˈɪɹ blˈuː ænd ɡɹˈiːn wˈɔːɾɚ
          - ðeɪ spˈɑːɹkəl lˈaɪk dʒˈuːəlz ˌʌndɚ ðə sˈʌn
    - text: The land looks like it belongs on another planet. People often say it feels like walking through a dream.
      phonemes:
          - ðə lˈænd lˈʊks lˈaɪk ɪt bᵻlˈɔŋz ˌɔn ɐnˈʌðɚ plˈænɪt
          - pˈiːpəl ˈɔfən sˈeɪ ɪt fˈiːlz lˈaɪk wˈɔːkɪŋ θɹuː ɐ dɹˈiːm
    - text: Lençóis Maranhenses has existed for nearly two million years. Wind and water have been shaping it for longer than humans have been around.
      phonemes:
          - lˈɛnswɑː mˈæɹɐnhˌɛnsᵻz hɐz ɛɡzˈɪstᵻd fɔːɹ nˌɪɹli tˈuː mˈɪliən jˈɪɹz
          - wˈɪnd ænd wˈɔːɾɚ hɐvbɪn ʃˈeɪpɪŋ ɪt fɔːɹ lˈɔŋɡɚ ðɐn hjˈuːmənz hɐvbɪn ɚɹˈaʊnd
    - text: The dunes cover about 350 square miles. That is bigger than many cities and towns combined.
      phonemes:
          - ðə dˈuːnz kˈʌvɚɹ ɐbˌaʊt θɹˈiːhˈʌndɹɪd fˈɪfti skwˈɛɹ mˈaɪlz
          - ðæt ɪz bˈɪɡɚ ðɐn mˈɛni sˈɪɾiz ænd tˈaʊnz kəmbˈaɪnd
    - text: Every year, the dunes slowly move. Strong winds push them up to 80 feet, changing the land again and again.
      phonemes:
          - ˈɛvɹi jˈɪɹ
          - ðə dˈuːnz slˈoʊli mˈuːv
          - stɹˈɔŋ wˈɪndz pˈʊʃ ðˌɛm ˌʌp tʊ ˈeɪɾi fˈiːt
          - tʃˈeɪndʒɪŋ ðə lˈænd ɐɡˈɛn ænd ɐɡˈɛn
    - text: This means the place never looks the same twice. A path you follow in the morning might vanish by afternoon.
      phonemes:
          - ðɪs mˈiːnz ðə plˈeɪs nˈɛvɚ lˈʊks ðə sˈeɪm twˈaɪs
