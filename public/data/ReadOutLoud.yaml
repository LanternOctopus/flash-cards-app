The Things Inside My Heart:
    - text: I want a turn to try again. I want to do my best.
      picture: thethingsinsidemyheart/thethingsinsidemyheart.png
      caption: A poem about feelings and good choices.
      alt: The Things Inside My Heart cover.
      phonemes:
          - aɪ wˈɔnt ɐ tˈɜːn tə tɹˈaɪ ɐɡˈɛn
          - aɪ wˈɔnt tə dˈuː maɪ bˈɛst
    - text: I need some help to finish up. I need a little rest.
      phonemes:
          - aɪ nˈiːd sˌʌm hˈɛlp tə fˈɪnɪʃ ˈʌp
          - aɪ nˈiːd ɐ lˈɪɾəl ɹˈɛst
    - text: I love my family every day. I love my friends at school.
      phonemes:
          - aɪ lˈʌv maɪ fˈæmɪli ˈɛvɹi dˈeɪ
          - aɪ lˈʌv maɪ fɹˈɛndz æt skˈuːl
    - text: I like to draw and read and build. I like to follow rules.
      phonemes:
          - aɪ lˈaɪk tə dɹˈɔː ænd ɹˈiːd ænd bˈɪld
          - aɪ lˈaɪk tə fˈɑːloʊ ɹˈuːlz
    - text: I hope tomorrow will be fun. I hope I learn something new.
      phonemes:
          - aɪ hˈoʊp təmˈɑːɹoʊ wɪl biː fˈʌn
          - aɪ hˈoʊp aɪ lˈɜːn sˈʌmθɪŋ nˈuː
    - text: My teacher says I'm allowed to ask. She says it's okay to do.
      phonemes:
          - maɪ tˈiːtʃɚ sˈɛz aɪm ɐlˈaʊd tʊ ˈæsk
          - ʃiː sˈɛz ɪts oʊkˈeɪ tə dˈuː
    - text: I must remember to be kind. I must try hard, it's true.
      phonemes:
          - aɪ mˈʌst ɹᵻmˈɛmbɚ təbi kˈaɪnd
          - aɪ mˈʌst tɹˈaɪ hˈɑːɹd
          - ɪts tɹˈuː
    - text: I should take turns and listen well. I should say ''please'' and ''thank you'' too.
      phonemes:
          - aɪ ʃˌʊd tˈeɪk tˈɜːnz ænd lˈɪsən wˈɛl
          - aɪ ʃˌʊd sˈeɪ plˈiːz ænd θˈæŋk juː tˈuː
    - text: I will keep trying when it's tough. I will not give up today.
      phonemes:
          - aɪ wɪl kˈiːp tɹˈaɪɪŋ wɛn ɪts tˈʌf
          - aɪ wɪl nˌɑːt ɡˈɪv ˌʌp tədˈeɪ
    - text: I would help others if I can. I would choose a gentle way.
      phonemes:
          - aɪ wʊd hˈɛlp ˈʌðɚz ɪf aɪ kˈæn
          - aɪ wʊd tʃˈuːz ɐ dʒˈɛntəl wˈeɪ
