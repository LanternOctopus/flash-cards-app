          - ðɪ ˈɛɡz hˈætʃ ˈɔːl ɐtwˈʌns
          - ðə lɐɡˈuːnz sˈʌdənli fˈɪl wɪð lˈaɪf ɐɡˈɛn
    - text: One famous fish here is the wolf fish. It is a strong predator with sharp teeth.
      phonemes:
