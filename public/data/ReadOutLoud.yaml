          - ɪnstˈɛd ʌv mˈæps
          - pˈiːpəl wˈɑːtʃ ðə wˈɪnd ænd ðə dˈuːn ɹˈɪdʒᵻz
          - ðə lˈænd tˈiːtʃᵻz ðˌɛm hˌaʊ tə tɹˈævəl
    - text: Even though it looks dry, Lençóis gets lots of rain. That is why it is not a true desert.
      phonemes:
          - ˈiːvən ðˌoʊ ɪt lˈʊks dɹˈaɪ
          - lˈɛnswɑː ɡˈɛts lˈɑːts ʌv ɹˈeɪn
          - ðæt ɪz wˌaɪ ɪɾ ɪz nˌɑːɾə tɹˈuː dˈɛzɚt
    - text: Under the sand lies a layer of solid rock. It holds water like a giant bathtub.
      phonemes:
          - ˌʌndɚ ðə sˈænd lˈaɪz ɐ lˈeɪɚɹ ʌv sˈɑːlɪd ɹˈɑːk
          - ɪt hˈoʊldz wˈɔːɾɚ lˈaɪk ɐ dʒˈaɪənt bˈæθtʌb
    - text: When rain falls, water gathers between the dunes. Soon, bright lagoons rise from the sand.
