          - wˈɔːɾɚ ɡˈæðɚz bᵻtwˌiːn ðə dˈuːnz
          - sˈuːn
          - bɹˈaɪt lɐɡˈuːnz ɹˈaɪz fɹʌmðə sˈænd
    - text: During the dry season, the lagoons slowly disappear. But the water never truly leaves.
      phonemes:
