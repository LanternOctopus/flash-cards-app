A dog named Chai:
    - answer: On a sunny street lived a dog named Chai,
      picture: chai/chai.png
      alt: Chai the dog
      caption: Chai enjoys sunny streets and helping his friends.
      phonemes:
          - ˌɔn ɐ sˈʌni stɹˈiːt lˈɪvd ɐ dˈɑːɡ nˈeɪmd tʃˈaɪ
    - answer: With floppy ears and a sparkle in his eye.
      phonemes:
          - wɪð flˈɑːpi ˈɪɹz ænd ɐ spˈɑːɹkəl ɪn hɪz ˈaɪ
    - answer: He wagged his tail at everyone he met,
      phonemes:
          - hiː wˈæɡd hɪz tˈeɪl æɾ ˈɛvɹɪwˌʌn hiː mˈɛt
    - answer: Happy as a dog could ever get.
      phonemes:
          - hˈæpi æz ɐ dˈɑːɡ kʊd ˈɛvɚ ɡˈɛt
    - answer: Chai loved naps by the tea shop door,
      phonemes:
          - tʃˈaɪ lˈʌvd nˈæps baɪ ðə tˈiː ʃˈɑːp dˈoːɹ
    - answer: Listening to cups clink and scooters roar.
      phonemes:
          - lˈɪsənɪŋ tə kˈʌps klˈɪŋk ænd skˈuːɾɚz ɹˈoːɹ
    - answer: The shopkeeper smiled and tossed him a treat,
      phonemes:
          - ðə ʃˈɑːpkiːpɚ smˈaɪld ænd tˈɔst hˌɪm ɐ tɹˈiːt
    - answer: Best dog buddy on the whole wide street.
      phonemes:
          - bˈɛst dˈɑːɡ bˈʌdi ɔnðə hˈoʊl wˈaɪd stɹˈiːt
    - answer: He chased pigeons but never too far,
      phonemes:
          - hiː tʃˈeɪst pˈɪdʒənz bˌʌt nˈɛvɚ tˈuː fˈɑːɹ
    - answer: Then rested in shade by a parked auto car.
      phonemes:
          - ðˈɛn ɹˈɛstᵻd ɪn ʃˈeɪd baɪ ɐ pˈɑːɹkt ˈɔːɾoʊ kˈɑːɹ
    - answer: Kids laughed loud when he did a spin,
      phonemes:
          - kˈɪdz lˈæft lˈaʊd wɛn hiː dˈɪd ɐ spˈɪn
    - answer: Chai bowed proudly, tail tucked in.
      phonemes:
          - tʃˈaɪ bˈaʊd pɹˈaʊdli
          - tˈeɪl tˈʌkt ˈɪn
    - answer: When rain poured down and puddles grew,
      phonemes:
          - wˌɛn ɹˈeɪn pˈoːɹd dˌaʊn ænd pˈʌdəlz ɡɹˈuː
    - answer: Chai splashed happily, soaked right through.
      phonemes:
          - tʃˈaɪ splˈæʃt hˈæpɪli
          - sˈoʊkt ɹˈaɪt θɹˈuː
    - answer: Mud on his paws, joy on his face,
      phonemes:
          - mˈʌd ˌɔn hɪz pˈɔːz
          - dʒˈɔɪ ˌɔn hɪz fˈeɪs
    - answer: Rainy days were his favorite place.
      phonemes:
          - ɹˈeɪni dˈeɪz wɜː hɪz fˈeɪvɚɹᵻt plˈeɪs
    - answer: At night he guarded the sleeping lane,
      phonemes:
          - æt nˈaɪt hiː ɡˈɑːɹdᵻd ðə slˈiːpɪŋ lˈeɪn
    - answer: A gentle hero in moonlight plain.
      phonemes:
          - ɐ dʒˈɛntəl hˈiəɹoʊ ɪn mˈuːnlaɪt plˈeɪn
    - answer: No collar, no leash, but loved so true,
      phonemes:
          - nˈoʊ kˈɑːlɚ
          - nˈoʊ lˈiːʃ
          - bˌʌt lˈʌvd sˌoʊ tɹˈuː
    - answer: The street was his home, his family too.
      phonemes:
          - ðə stɹˈiːt wʌz hɪz hˈoʊm
          - hɪz fˈæmɪli tˈuː
    - answer: So if you see Chai wag and grin,
      phonemes:
          - sˌoʊ ɪf juː sˈiː tʃˈaɪ wˈæɡ ænd ɡɹˈɪn
    - answer: Give a soft hello, let kindness in.
      phonemes:
          - ɡˈɪv ɐ sˈɔft həlˈoʊ
          - lˈɛt kˈaɪndnəs ˈɪn
