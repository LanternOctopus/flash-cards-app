verbs:
  - ["like", "ಇಷ್ಟಪಡುವುದು", "Iṣṭapaḍuvudu", "I like ice cream.", "ನನಗೆ ಐಸ್ ಕ್ರೀಮ್ ಇಷ್ಟ.", "enjoy", "To enjoy or find pleasure in something."]
  - ["like", "ಹೋಲಿಸುವುದು", "Hōlisuvudu", "This toy is like that one.", "ಈ ಆಟಿಕೆ ಆ ಆಟಿಕೆಯ ಹೋಲಿಸುತ್ತದೆ.", "similar to", "To be similar to or have a resemblance to something."]
  - ["like", "ಆಸಕ್ತಿಯುಳ್ಳ", "Āsaktiyuḷḷa", "I like reading books.", "ನನಗೆ ಪುಸ್ತಕಗಳನ್ನು ಓದುವುದು ಆಸಕ್ತಿಯುಳ್ಳದು.", "to show preference", "To show a preference for someone or something."]
  - ["understand", "ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು", "arthamāḍikoḷḷuvudu", "I understand the story we read in class.", "ನಾವು ತರಗತಿಯಲ್ಲಿ ಓದಿದ ಕಥೆಯನ್ನು ನಾನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತೇನೆ.", "comprehend", "To grasp the meaning of something."]
  - ["understand", "ತಿಳಿಯುವುದು", "tiḷiyuvudu", "Do you understand how to solve this math problem?", "ನೀವು ಈ ಗಣಿತ ಸಮಸ್ಯೆ ಹೇಗೆ ಪರಿಹರಿಸಬೇಕು ಎಂದು ತಿಳಿಯುತ್ತೀರಾ?", "know", "To have knowledge about a subject."]
  - ["understand", "ಜಾಣ್ಮೆ ಹೊಂದುವುದು", "jāṇme hondudu", "I understand that we need to work together.", "ನಾವು ಒಟ್ಟಾಗಿ ಕೆಲಸ ಮಾಡಬೇಕೆಂದು ನಾನು ಜಾಣ್ಮೆ ಹೊಂದಿದ್ದೇನೆ.", "realize", "To become aware of something."]
  - ["begin", "ಆರಂಭಿಸು", "Ārambhisu", "Let's begin the game now.", "ನಾವು ಈಗ ಆಟವನ್ನು ಆರಂಭಿಸೋಣ.", "start", "To start something or to make a beginning."]
  - ["begin", "ಪ್ರಾರಂಭಿಸು", "Prārambhisu", "The school will begin at 9 AM.", "ಶಾಲೆ ಬೆಳಿಗ್ಗೆ 9 ಗಂಟೆಗೆ ಪ್ರಾರಂಭವಾಗುತ್ತದೆ.", "commence", "To commence or to officially start an event."]
