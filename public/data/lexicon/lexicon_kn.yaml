  - ["follow", "ಹಿಂದೆ ಹೋಗು", "Hinde hōgu", "I will follow you to the park.", "ನಾನು ನಿನ್ನನ್ನು ಉದ್ಯಾನಕ್ಕೆ ಹಿಂಡೇ ಹೋಗುತ್ತೇನೆ.", "to go after", "To go or move behind someone or something."]
