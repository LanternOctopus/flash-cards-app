adjectives:
    - question: "good"
      english: "This is a good book."
      targetLang: "ഇത് ഒരു നല്ല പുസ്തകമാണ്."
      phonetics: "ithu oru nalla pusthakamanu."
      distractors:
          choices:
              - "This is a bad book."
              - "This is a big book."
              - "This is a new book."
              - "This is an old book."
          translations:
              - "ഇത് ഒരു മോശം പുസ്തകമാണ്."
              - "ഇത് ഒരു വലിയ പുസ്തകമാണ്."
              - "ഇത് ഒരു പുതിയ പുസ്തകമാണ്."
              - "ഇത് ഒരു പഴയ പുസ്തകമാണ്."
          transliterations:
              - "ithu oru mosham pusthakamanu."
              - "ithu oru valiya pusthakamanu."
              - "ithu oru puthiya pusthakamanu."
              - "ithu oru pazhaya pusthakamanu."
      learningHint: "‘Good’ describes something positive."

    - question: "bad"
      english: "This is a bad idea."
      targetLang: "ഇത് ഒരു മോശം ആശയമാണ്."
      phonetics: "ithu oru mosham aashayamanu."
      distractors:
          choices:
              - "This is a good idea."
              - "This is a big idea."
              - "This is a new idea."
              - "This is an easy idea."
          translations:
              - "ഇത് ഒരു നല്ല ആശയമാണ്."
              - "ഇത് ഒരു വലിയ ആശയമാണ്."
              - "ഇത് ഒരു പുതിയ ആശയമാണ്."
              - "ഇത് ഒരു എളുപ്പമുള്ള ആശയമാണ്."
          transliterations:
              - "ithu oru nalla aashayamanu."
              - "ithu oru valiya aashayamanu."
              - "ithu oru puthiya aashayamanu."
              - "ithu oru eluppamulla aashayamanu."
      learningHint: "‘Bad’ is the opposite of ‘good’."

    - question: "big"
      english: "This is a big house."
      targetLang: "ഇത് ഒരു വലിയ വീടാണ്."
      phonetics: "ithu oru valiya veedanu."
      distractors:
          choices:
              - "This is a small house."
              - "This is a good house."
              - "This is a new house."
              - "This is an old house."
          translations:
              - "ഇത് ഒരു ചെറിയ വീടാണ്."
              - "ഇത് ഒരു നല്ല വീടാണ്."
              - "ഇത് ഒരു പുതിയ വീടാണ്."
              - "ഇത് ഒരു പഴയ വീടാണ്."
          transliterations:
              - "ithu oru cheriya veedanu."
              - "ithu oru nalla veedanu."
              - "ithu oru puthiya veedanu."
              - "ithu oru pazhaya veedanu."
      learningHint: "‘Big’ describes size."

