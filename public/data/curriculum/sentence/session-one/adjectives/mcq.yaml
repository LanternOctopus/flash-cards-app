              - "ഇത് ഒരു നല്ല മുറിയാണ്."
              - "ഇത് ഒരു പുതിയ മുറിയാണ്."
              - "ഇത് ഒരു പഴയ മുറിയാണ്."
          transliterations:
              - "ithu oru valiya muriyanu."
