verbs:
    - prompt_en: "He went to the market."
      prompt_targetLang: "അവൻ മാർക്കറ്റിൽ പോയി."
      prompt_phonetics: "avan markettil poyi."

      answer: "He went to the market."
      answer_targetLang: "അവൻ മാർക്കറ്റിൽ പോയി."
      answer_phonetics: "avan markettil poyi."

      distractors:
          en:
              - "He goes to the market."
              - "He will go to the market tomorrow."
              - "They went to the market."

          targetLang:
              - "അവൻ മാർക്കറ്റിൽ പോകുന്നു."
              - "അവൻ നാളെ മാർക്കറ്റിൽ പോകും."
              - "അവർ മാർക്കറ്റിൽ പോയി."

          phonetics:
              - "avan markettil pokunnu."
              - "avan nale markettil pokum."
              - "avar markettil poyi."

      learningHint: "Past of 'go' is 'went' for all subjects."

    - prompt_en: "They go to school every day."
      prompt_targetLang: "അവർ എല്ലാ ദിവസവും സ്കൂളിൽ പോകുന്നു."
      prompt_phonetics: "avar ellaa divasavum schoolil pokunnu."

      answer: "They go to school every day."
      answer_targetLang: "അവർ എല്ലാ ദിവസവും സ്കൂളിൽ പോകുന്നു."
      answer_phonetics: "avar ellaa divasavum schoolil pokunnu."

      distractors:
          en:
              - "They went to school yesterday."
              - "They will go to school tomorrow."
              - "He goes to school every day."

          targetLang:
              - "അവർ ഇന്നലെ സ്കൂളിൽ പോയി."
              - "അവർ നാളെ സ്കൂളിൽ പോകും."
