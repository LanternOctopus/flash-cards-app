verbs:
    - question: "go"
      english: "He went to the market."
      targetLang: "അവൻ മാർക്കറ്റിൽ പോയി."
      phonetics: "avan markettil poyi."
      distractors:
          choices:
              - "He go to the market yesterday."
              - "They goes to the market."
              - "He is went to the market."
          translations:
              - "അവൻ ഇന്നലെ മാർക്കറ്റിൽ പോകുന്നു."
              - "അവർ മാർക്കറ്റിൽ പോകുന്നു."
              - "അവൻ മാർക്കറ്റിൽ പോയിട്ടുണ്ട്."
          transliterations:
              - "avan innale markettil pokunnu."
              - "avar markettil pokunnu."
              - "avan markettil poyittundu."
      learningHint: "Past of 'go' is 'went' for all subjects."
      meta:
          subject: "he"
          tense: "simple past"

    - question: "go"
      english: "They go to school every day."
      targetLang: "അവർ എല്ലാ ദിവസവും സ്കൂളിൽ പോകുന്നു."
      phonetics: "avar ellaa divasavum schoolil pokunnu."
      distractors:
          choices:
              - "They goes to school every day."
              - "They is go to school every day."
              - "They went to school every day."
          translations:
              - "അവർ എല്ലാ ദിവസവും സ്കൂളിൽ പോകുന്നു."
              - "അവർ എല്ലാ ദിവസവും സ്കൂളിൽ പോകുന്നു."
              - "അവർ എല്ലാ ദിവസവും സ്കൂളിൽ പോയി."
          transliterations:
              - "avar ellaa divasavum schoolil pokunnu."
              - "avar ellaa divasavum schoolil pokunnu."
              - "avar ellaa divasavum schoolil poyi."
      learningHint: "Plural subjects use base verb 'go'."
      meta:
          subject: "they"
          tense: "present simple"

    - question: "see"
      english: "She sees the teacher in the hall."
      targetLang: "അവൾ ഹാളിൽ ടീച്ചറെ കാണുന്നു."
      phonetics: "aval haalil teacher-e kaanunnu."
      distractors:
          choices:
              - "She see the teacher in the hall."
              - "She seen the teacher in the hall."
              - "They sees the teacher in the hall."
          translations:
              - "അവൾ ഹാളിൽ ടീച്ചറെ കാണുന്നു."
              - "അവൾ ഹാളിൽ ടീച്ചറെ കണ്ടു."
              - "അവർ ഹാളിൽ ടീച്ചറെ കാണുന്നു."
          transliterations:
              - "aval haalil teacher-e kaanunnu."
              - "aval haalil teacher-e kandu."
              - "avar haalil teacher-e kaanunnu."
      learningHint: "He/She/It takes 'sees' in present simple."
      meta:
          subject: "she"
          tense: "present simple"

