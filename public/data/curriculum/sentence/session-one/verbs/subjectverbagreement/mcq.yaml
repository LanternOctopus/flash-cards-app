    - question: "give"
      english: "He gives a gift to the child."
      targetLang: "അവൻ കുട്ടിക്ക് ഒരു സമ്മാനം കൊടുക്കുന്നു."
      phonetics: "avan kutti-kku oru sammanam kodukkunnu."
      distractors:
          choices:
              - "He give a gift to the child."
              - "He gave a gift every day."
              - "They gives a gift to the child."
          translations:
              - "അവൻ കുട്ടിക്ക് ഒരു സമ്മാനം കൊടുക്കുന്നു."
              - "അവൻ ഓരോ ദിവസവും ഒരു സമ്മാനം കൊടുത്തു."
              - "അവർ കുട്ടിക്ക് ഒരു സമ്മാനം കൊടുക്കുന്നു."
          transliterations:
              - "avan kutti-kku oru sammanam kodukkunnu."
              - "avan oro divasavum oru sammanam koduthu."
              - "avar kutti-kku oru sammanam kodukkunnu."
      learningHint: "He/She/It takes 'gives'."
      meta:
          subject: "he"
          tense: "present simple"

