sentence_verbs_session_1:
    - prompt_en: "I go to the office every morning."
      prompt_targetLang: "ഞാൻ എല്ലാ ദിവസവും രാവിലെ ഓഫീസിൽ പോകുന്നു."
      prompt_phonetics: "njan ella divasavum ravile officil pokunnu."

      answer: "I go to the office every morning."
      answer_targetLang: "ഞാൻ എല്ലാ ദിവസവും രാവിലെ ഓഫീസിൽ പോകുന്നു."
      answer_phonetics: "njan ella divasavum ravile officil pokunnu."

      distractors:
          en:
              - "I went to the office yesterday morning."
              - "I will go to the office tomorrow morning."

          targetLang:
              - "ഞാൻ ഇന്നലെ രാവിലെ ഓഫീസിൽ പോയി."
              - "ഞാൻ നാളെ രാവിലെ ഓഫീസിൽ പോകും."

          phonetics:
              - "njan innale ravile officil poyi."
              - "njan nale ravile officil pokum."

      learningHint: "Use simple present for habits and routines."

    - prompt_en: "We went to the party last night."
      prompt_targetLang: "ഞങ്ങൾ ഇന്നലെ രാത്രി പാർട്ടിക്ക് പോയി."
      prompt_phonetics: "njangal innale rathri party-kku poyi."

      answer: "We went to the party last night."
      answer_targetLang: "ഞങ്ങൾ ഇന്നലെ രാത്രി പാർട്ടിക്ക് പോയി."
      answer_phonetics: "njangal innale rathri party-kku poyi."

      distractors:
          en:
              - "We go to the party every night."
              - "We will go to the party tomorrow night."

          targetLang:
              - "ഞങ്ങൾ എല്ലാ രാത്രിയും പാർട്ടിക്ക് പോകുന്നു."
              - "ഞങ്ങൾ നാളെ രാത്രി പാർട്ടിക്ക് പോകും."

          phonetics:
              - "njangal ella rathriyilum party-kku pokunnu."
              - "njangal nale rathri party-kku pokum."

      learningHint: "'Went' is the past tense of 'go'."

    - prompt_en: "They will go to a new place next year."
      prompt_targetLang: "അവർ അടുത്ത വർഷം പുതിയൊരു സ്ഥലത്തേക്ക് പോകും."
      prompt_phonetics: "avar adutha varsham puthiyoru sthalathekku pokum."

      answer: "They will go to a new place next year."
      answer_targetLang: "അവർ അടുത്ത വർഷം പുതിയൊരു സ്ഥലത്തേക്ക് പോകും."
      answer_phonetics: "avar adutha varsham puthiyoru sthalathekku pokum."

      distractors:
          en:
              - "They go to a new place every year."
              - "They went to a new place last year."

          targetLang:
              - "അവർ എല്ലാ വർഷവും പുതിയ സ്ഥലത്തേക്ക് പോകുന്നു."
              - "അവർ കഴിഞ്ഞ വർഷം പുതിയ സ്ഥലത്തേക്ക് പോയി."

          phonetics:
              - "avar ella varshavum puthiya sthalathekku pokunnu."
              - "avar kazhinja varsham puthiya sthalathekku poyi."

      learningHint: "Use 'will go' for future actions."

    - prompt_en: "I see a big problem with this idea."
      prompt_targetLang: "ഈ ആശയത്തിൽ എനിക്ക് വലിയൊരു പ്രശ്നം കാണുന്നു."
      prompt_phonetics: "ee aashayathil enikku valiyoru prashnam kaanunnu."

      answer: "I see a big problem with this idea."
      answer_targetLang: "ഈ ആശയത്തിൽ എനിക്ക് വലിയൊരു പ്രശ്നം കാണുന്നു."
      answer_phonetics: "ee aashayathil enikku valiyoru prashnam kaanunnu."

      distractors:
          en:
              - "I saw a big problem with this idea yesterday."
              - "I will see a big problem with this idea tomorrow."

          targetLang:
              - "ഈ ആശയത്തിൽ എനിക്ക് ഇന്നലെ വലിയൊരു പ്രശ്നം കണ്ടു."
              - "ഈ ആശയത്തിൽ എനിക്ക് നാളെ വലിയൊരു പ്രശ്നം കാണും."

          phonetics:
              - "ee aashayathil enikku innale valiyoru prashnam kandu."
              - "ee aashayathil enikku nale valiyoru prashnam kaanum."

      learningHint: "Use simple present for thoughts and opinions."

    - prompt_en: "The girl sees a small thing under the table."
      prompt_targetLang: "മേശയുടെ അടിയിൽ പെൺകുട്ടി ഒരു ചെറിയ സാധനം കാണുന്നു."
      prompt_phonetics: "meshayude adiyil penkutti oru cheriya saadhanam kaanunnu."

      answer: "The girl sees a small thing under the table."
      answer_targetLang: "മേശയുടെ അടിയിൽ പെൺകുട്ടി ഒരു ചെറിയ സാധനം കാണുന്നു."
      answer_phonetics: "meshayude adiyil penkutti oru cheriya saadhanam kaanunnu."

      distractors:
          en:
              - "The girl saw a small thing under the table."
              - "The girl will see a small thing under the table."

          targetLang:
              - "മേശയുടെ അടിയിൽ പെൺകുട്ടി ഒരു ചെറിയ സാധനം കണ്ടു."
              - "മേശയുടെ അടിയിൽ പെൺകുട്ടി ഒരു ചെറിയ സാധനം കാണും."

          phonetics:
              - "meshayude adiyil penkutti oru cheriya saadhanam kandu."
              - "meshayude adiyil penkutti oru cheriya saadhanam kaanum."

      learningHint: "Use 'sees' with singular subjects like 'the girl'."

    - prompt_en: "My mother works at the hospital."
      prompt_targetLang: "എന്റെ അമ്മ ആശുപത്രിയിൽ ജോലി ചെയ്യുന്നു."
      prompt_phonetics: "ente amma aashupathriyil joli cheyyunnu."

      answer: "My mother works at the hospital."
      answer_targetLang: "എന്റെ അമ്മ ആശുപത്രിയിൽ ജോലി ചെയ്യുന്നു."
      answer_phonetics: "ente amma aashupathriyil joli cheyyunnu."

      distractors:
          en:
              - "My mother worked at the hospital last year."
              - "My mother will work at the hospital next year."

          targetLang:
              - "എന്റെ അമ്മ കഴിഞ്ഞ വർഷം ആശുപത്രിയിൽ ജോലി ചെയ്തു."
              - "എന്റെ അമ്മ അടുത്ത വർഷം ആശുപത്രിയിൽ ജോലി ചെയ്യും."

          phonetics:
              - "ente amma kazhinja varsham aashupathriyil joli cheythu."
              - "ente amma adutha varsham aashupathriyil joli cheyyum."

      learningHint: "Use 'works' with singular subjects."

    - prompt_en: "I give the money to the person at the door."
      prompt_targetLang: "ഞാൻ വാതിലിലുള്ള ആൾക്ക് പണം നൽകുന്നു."
      prompt_phonetics: "njan vaathililulla aalkku panam nalkunnu."

      answer: "I give the money to the person at the door."
      answer_targetLang: "ഞാൻ വാതിലിലുള്ള ആൾക്ക് പണം നൽകുന്നു."
      answer_phonetics: "njan vaathililulla aalkku panam nalkunnu."

      distractors:
          en:
              - "I gave the money to the person at the door yesterday."
              - "I will give the money to the person at the door tomorrow."

          targetLang:
              - "ഞാൻ ഇന്നലെ വാതിലിലുള്ള ആൾക്ക് പണം നൽകി."
              - "ഞാൻ നാളെ വാതിലിലുള്ള ആൾക്ക് പണം നൽകും."

          phonetics:
              - "njan innale vaathililulla aalkku panam nalki."
              - "njan nale vaathililulla aalkku panam nalkum."

      learningHint: "Use simple present for regular actions."

    - prompt_en: "I think the new job is very good."
      prompt_targetLang: "പുതിയ ജോലി വളരെ നല്ലതാണെന്ന് എനിക്ക് തോന്നുന്നു."
      prompt_phonetics: "puthiya joli valare nallathaanennu enikku thonnunnu."

      answer: "I think the new job is very good."
      answer_targetLang: "പുതിയ ജോലി വളരെ നല്ലതാണെന്ന് എനിക്ക് തോന്നുന്നു."
      answer_phonetics: "puthiya joli valare nallathaanennu enikku thonnunnu."

      distractors:
          en:
              - "I thought the new job was very good."
              - "I will think the new job is very good."

          targetLang:
              - "പുതിയ ജോലി വളരെ നല്ലതാണെന്ന് എനിക്ക് തോന്നി."
              - "പുതിയ ജോലി വളരെ നല്ലതാണെന്ന് എനിക്ക് തോന്നും."

          phonetics:
              - "puthiya joli valare nallathaanennu enikku thonni."
              - "puthiya joli valare nallathaanennu enikku thonnum."

